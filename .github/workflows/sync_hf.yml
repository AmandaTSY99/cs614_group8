name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main
      - dev
      - feat/system-c-core
      - feature/system-c-adaptive-rag
      - feat/system-c-benchmark-integration
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Push Clean Application to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure Git Author
          git config --global user.email "bot@huggingface.co"
          git config --global user.name "HuggingFace Sync Bot"

          # Create a lightweight deploy package (excludes 948MB of raw .htm files)
          mkdir -p /tmp/hf_deploy
          # README.md carries the Space config header (sdk, app_file); keep it at the top of the file
          cp -r app.py requirements.txt README.md src ui app_data .streamlit /tmp/hf_deploy/
          # Spaces reject binary files pushed without LFS: ship the benchmark bundle as plain JSON (~5 MB)
          gunzip /tmp/hf_deploy/app_data/benchmark.json.gz
          # Live Systems A and B reuse the RQ2 evaluation adapters
          mkdir -p /tmp/hf_deploy/scripts/rq2
          cp scripts/rq2/__init__.py scripts/rq2/adapters.py /tmp/hf_deploy/scripts/rq2/
          mkdir -p /tmp/hf_deploy/data
          cp data/financials.csv data/filings_index.csv data/benchmark_qa_pool_2015.json /tmp/hf_deploy/data/

          # Initialize a clean, lightweight Git repository (only ~3 MB)
          cd /tmp/hf_deploy
          git init -b main
          git add .
          git commit -m "Deploy System C Streamlit to Hugging Face Spaces"

          if [ -z "$HF_TOKEN" ]; then
            echo "ERROR: HF_TOKEN secret is empty or not found in repository secrets!"
            exit 1
          fi

          # Push to Hugging Face Space
          git push --force https://siranishkd9x:$HF_TOKEN@huggingface.co/spaces/siranishkd9x/rag_experimentation main
