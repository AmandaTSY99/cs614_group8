name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main
      - feat/system-c-core
      - feature/system-c-adaptive-rag
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://siranishkd9x:$HF_TOKEN@huggingface.co/spaces/siranishkd9x/rag_experimentation HEAD:main
